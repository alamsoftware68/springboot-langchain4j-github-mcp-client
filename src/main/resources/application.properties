spring.application.name=github-mcp-server

# Local secrets file (git-ignored). Values can also come from environment variables.
spring.config.import=optional:file:./secrets.properties

#below are the custom tag, we can give anything
org.khan.mcp.npx=npx.cmd
org.khan.github.token=${GITHUB_TOKEN}
logging.level.dev.langchain4j.mcp=DEBUG

langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.chat-model.temperature=0.0
